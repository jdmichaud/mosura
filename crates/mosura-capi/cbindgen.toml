# The committed `include/mosura.h` is generated from this crate with `cargo xtask header`
# (design E11): the header is reviewed like source; cbindgen is an xtask-only dependency.
language = "C"
include_guard = "MOSURA_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation_style = "doxy"
header = """/*
 * mosura.h — the mosura C API. GENERATED by `cargo xtask header` from crates/mosura-capi;
 * do not edit by hand. Conventions (docs/product/architecture.md §4.5): every function returns a
 * mosura_status, details via mosura_last_error() (per thread); no panic crosses this boundary;
 * handles are opaque and released with mosura_release(); a mosura_view borrows (valid while the
 * producing handle lives), a mosura_bytes is owned (mosura_bytes_dispose); strings are UTF-8,
 * `const char *` parameters NUL-terminated; structs passed by pointer start with size + version.
 */"""
trailer = """/** Initializer for mosura_ctx_config: the current struct size, version 1, everything else off. */
#define MOSURA_CTX_CONFIG_INIT { (uint32_t)sizeof(mosura_ctx_config), 1, NULL, 0, NULL, 0, NULL, NULL, NULL, 0 }"""

[enum]
rename_variants = "None"
prefix_with_name = false

[fn]
sort_by = "None"

[parse]
parse_deps = false
